[project]
name = "scenesense"
version = "0.1.0"
description = "Urban scene understanding on Singapore driving video: detection + tracking, grounded VQA, and an LLM scene-query agent."
readme = "README.md"
authors = [
    { name = "John Charles", email = "johncharles.steve@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "mlflow>=3.17.2",
    "nuscenes-devkit>=1.2.0",
    "peft>=0.21.2",
    "pillow>=13.0.0",
    "pycocotools>=2.0.11",
    "pyyaml>=6.0.3",
    "supervision>=0.31.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[project.scripts]
scenesense = "scenesense:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
